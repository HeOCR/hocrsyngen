[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hocrsyngen"
version = "0.1.0"
description = "Synthetic Hebrew OCR/HTR sample generation for the HeOCR project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "HeOCR" },
]
dependencies = [
  "jsonschema>=4",
  "Pillow>=10",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
hocrsyngen = "hocrsyngen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hocrsyngen = [
  "data/synthetic/fonts/*.ttf",
  "data/synthetic/fonts/*.txt",
  "data/synthetic/fonts/*.yaml",
  "data/synthetic/texts/*.txt",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
