name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install native libraqm dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraqm-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libopenjp2-7-dev \
            libtiff-dev \
            libwebp-dev \
            pkg-config

      - name: Install native libraqm dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libraqm pkg-config jpeg zlib freetype lcms2 openjpeg libtiff webp

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --force-reinstall --no-binary Pillow -C raqm=enable "Pillow>=10"
          python -m pip install -e ".[test]"

      - name: Verify Pillow libraqm support
        run: |
          python - <<'PY'
          from PIL import features

          if not features.check("raqm"):
              raise SystemExit("Pillow libraqm support is required for Hebrew RTL rendering tests.")
          PY

      - name: Run tests
        run: python -m pytest

      - name: Run CLI smoke checks
        run: |
          PYTHONPATH=src python -m hocrsyngen.cli templates
          PYTHONPATH=src python -m hocrsyngen.cli contracts --format json
          PYTHONPATH=src python -m hocrsyngen.cli generate --count 2 --seed 17 --output out/fixture-batch
          PYTHONPATH=src python -m hocrsyngen.cli validate out/fixture-batch --format json

  package:
    name: Build and install package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native libraqm dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraqm-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libopenjp2-7-dev \
            libtiff-dev \
            libwebp-dev \
            pkg-config

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build

      - name: Install wheel in clean virtual environment
        run: |
          python -m venv .ci-wheel-venv
          . .ci-wheel-venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --force-reinstall --no-binary Pillow -C raqm=enable "Pillow>=10"
          python -m pip install dist/hocrsyngen-*.whl
          python - <<'PY'
          from PIL import features

          if not features.check("raqm"):
              raise SystemExit("Pillow libraqm support is required for installed CLI smoke checks.")
          PY
          hocrsyngen templates
          hocrsyngen contracts --format json
          hocrsyngen generate --count 2 --seed 17 --output out/wheel-fixture-batch
          hocrsyngen validate out/wheel-fixture-batch --format json

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: hocrsyngen-dist
          path: dist/*
